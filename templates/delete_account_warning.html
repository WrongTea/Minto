<!-- ======================================================
     DELETE ACCOUNT WARNING
     ====================================================== -->

<div class="delete-account-modal" id="deleteAccountModal">

    <div class="delete-account-modal-box">

        <h3 class="delete-account-modal-title">
            Delete account?
        </h3>

        <p class="delete-account-modal-message">
            Are you sure you want to delete your account?
            This action cannot be undone.
        </p>

        <div class="delete-account-modal-buttons">

            <button
                class="delete-account-modal-button delete-account-modal-cancel"
                id="deleteAccountCancel">
                Cancel
            </button>

            <button
                class="delete-account-modal-button delete-account-modal-confirm"
                id="deleteAccountConfirm">
                Delete account
            </button>

        </div>

    </div>

</div>
